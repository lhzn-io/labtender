<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labtender prices</title>
<link rel="stylesheet" href="/common.css">
<style>
                  border: 1px solid var(--line); background: var(--track); color: var(--ink); }
  main { display: grid; gap: 12px; padding: 8px 16px 24px;
         grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .sub { color: var(--muted); font-size: 12px; }
  .tile { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; }
  .hero { font: 500 24px/1.2 var(--mono); }
  .stat { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font: 10.5px/1.5 var(--mono); }
  th { text-align: left; color: var(--muted); font: 700 9px/1.4 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 6px 4px 0;
       border-bottom: 1px solid var(--line); }
  td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.num { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .ready { color: var(--ok); } .off { color: var(--muted); }
  svg.trend { width: 120px; height: 24px; display: block; }
  .empty { color: var(--muted); font-size: 12px; }
  .err { color: var(--bad); font-size: 12px; }
  .card h2 { margin: 0 0 10px; font: 700 10px/1.2 var(--sans); letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
</style>
<script src="/theme.js"></script>
</head>
<body>
<div class="strip"><span class="meta" id="meta">loading</span><button class="theme-icon" data-theme-toggle></button></div>
<header class="mast">
  <a class="wordmark" href="/">labtender<span class="page">prices</span></a>
  <nav>
  <button id="refresh" title="Quote every watched GPU now (an operator token is needed)">Refresh quotes</button>
  <a href="/">board</a></nav>
</header>
<main id="cards"></main>
<script src="/auth.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v, d = 2) => (v == null ? "-" : `$${Number(v).toFixed(d)}`);
function ago(t, now) {
  if (!t) return "never";
  const s = now - t;
  return s < 120 ? `${Math.round(s)} s ago` : s < 7200 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`;
}
const when = (t) => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

// One provider's cheapest price over the sampled history: a single series, so no legend; the
// row it sits in names it. Each point carries a hover readout.
function trend(points) {
  if (!points || points.length < 2) return `<span class="sub">after the next sample</span>`;
  const w = 120, h = 24, pad = 3;
  const t0 = points[0][0], t1 = points[points.length - 1][0];
  const vs = points.map((p) => p[1]), lo = Math.min(...vs), hi = Math.max(...vs);
  const x = (t) => pad + (t - t0) / Math.max(1, t1 - t0) * (w - 2 * pad);
  const y = (v) => hi === lo ? h / 2 : h - pad - (v - lo) / (hi - lo) * (h - 2 * pad);
  const line = points.map((p) => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const dots = points.map((p) => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="5" fill="transparent"><title>${esc(when(p[0]))}: ${money(p[1], 3)}/h</title></circle>`).join("");
  const last = points[points.length - 1];
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" role="img" aria-label="cheapest price over time, from ${money(lo, 3)} to ${money(hi, 3)} per hour">` +
    `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${line}"/>` +
    `<circle cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="2.5" fill="var(--accent)"/>${dots}</svg>`;
}

function runRateCard(r) {
  const yachts = r.yachts ? `${r.yachts} yacht${r.yachts > 1 ? "s" : ""} out` : "no yachts out";
  return `<section class="card"><h2>Run rate</h2>
    <div class="tile">
      <div><div class="hero">${money(r.rate_usd_h, r.rate_usd_h && r.rate_usd_h < 10 ? 3 : 2)}/h</div><div class="sub">${yachts}, right now</div></div>
      <div class="stat"><div>${money(r.month_spent_usd)}</div><div class="sub">spent this month</div></div>
      <div class="stat"><div>${money(r.month_worst_case_usd)}</div><div class="sub">month at most, if every live yacht ran to its time limit</div></div>
    </div></section>`;
}

function gpuCard(g) {
  if (!g.providers.length) {
    return `<section class="card"><h2>${esc(g.gpu)}</h2><div class="empty">no quotes yet</div></section>`;
  }
  const rows = g.providers.map((p) => {
    const c = p.cheapest;
    const ready = p.launchable ? `<span class="badge ready">ready</span>` : `<span class="badge off">not set up</span>`;
    return `<tr><td>${esc(p.provider)}</td><td>${esc(c.region)}${p.regions > 1 ? ` <span class="sub">+${p.regions - 1}</span>` : ""}</td>
      <td class="num">${money(c.rate_usd_h, 3)}/h</td><td>${ready}</td><td>${trend(p.trend)}</td></tr>`;
  }).join("");
  return `<section class="card"><h2>${esc(g.gpu)} <span class="sub">via ${esc(g.plugin)}</span></h2>
    <table><thead><tr><th>provider</th><th>cheapest region</th><th class="num">price</th><th>status</th><th>last 30 days</th></tr></thead>
    <tbody>${rows}</tbody></table></section>`;
}

async function load() {
  try {
    const v = await (await fetch("/api/prices", { cache: "no-store" })).json();
    $("#cards").innerHTML = runRateCard(v.run_rate) + (v.gpus.map(gpuCard).join("") ||
      `<section class="card"><div class="empty">Nothing on the watch list: add charter profiles, or list GPUs in prices.toml.</div></section>`);
    $("#meta").textContent = `quotes sampled ${ago(v.sampled_at, v.time)} · on-demand list prices from each plugin's catalog`;
  } catch (e) {
    $("#meta").textContent = `labtender service unreachable (${e.message})`;
  }
}

$("#refresh").addEventListener("click", async () => {
  $("#meta").textContent = "quoting...";
  const r = await ltFetch("/api/prices/refresh", { method: "POST" });
  if (!r.ok) {
    $("#meta").innerHTML = `<span class="err">refresh refused: ${esc((await r.json()).detail)}</span>`;
    return;
  }
  load();
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
