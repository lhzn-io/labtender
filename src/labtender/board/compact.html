<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labtender</title>
<link rel="stylesheet" href="/common.css">
<style>
  /* A narrow column for a corner of the screen: per GPU three small gauges (load, memory,
     temperature) and who holds it; per host its running runs. */
  body { font-size: 12px; }
  .strip { padding-left: 10px; }
  .strip a { color: inherit; text-decoration: none; }
  .strip a:hover { color: var(--accent-hi); }
  .strip b { margin-right: 8px; font: 300 11px/1 var(--sans); letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
  main { padding: 2px 10px 10px; }
  .host { border-bottom: 1px solid var(--line); padding: 7px 0 6px; }
  .hname { display: flex; gap: 7px; align-items: center; font-weight: 600; font-size: 13px; letter-spacing: 0.03em; }
  .hname .note { margin-left: auto; font: 400 9.5px var(--mono); color: var(--muted); white-space: nowrap; }
  .hname .note.warn { color: var(--warn); } .hname .note.bad { color: var(--bad); }
  .card { display: grid; grid-template-columns: 22px repeat(3, 34px) minmax(0, 1fr); gap: 4px; align-items: center; margin-top: 4px; }
  .card .lab { font: 9.5px var(--mono); color: var(--muted); }
  .card .who { padding-left: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 10px/1.35 var(--mono); color: var(--muted); }
  .card .who b { font: 600 12px var(--sans); color: var(--ink); }
  .card .who .flag { color: var(--warn); }
  .crun { display: grid; grid-template-columns: 22px minmax(0, 1fr) 46px auto; gap: 6px; align-items: center; margin-top: 4px; font: 10px var(--mono); }
  .crun .lab, .crun .val { color: var(--muted); white-space: nowrap; }
  .crun .bar > i { background: var(--util); }
  /* Ellipsis on the left keeps the end of a run name, usually its most specific part. */
  .rname { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; direction: rtl; text-align: left; font-family: var(--sans); font-size: 12px; }
  .rname a { color: inherit; text-decoration: none; } .rname a:hover { text-decoration: underline; }
  .yachts { padding: 6px 0; border-bottom: 1px solid var(--line); font: 10px var(--mono); }
  .yachts .warn { color: var(--warn); } .yachts .bad { color: var(--bad); }
  .yachts:empty { display: none; }
</style>
<script src="/theme.js"></script>
</head>
<body>
<div class="strip"><a href="/" target="_blank" title="Open the full board"><b>labtender</b><span id="meta">loading</span></a><span class="meta"></span><button class="theme-icon" data-theme-toggle></button></div>
<main>
  <div id="yachts" class="yachts"></div>
  <div id="hosts"></div>
</main>
<script src="/gauge.js"></script>
<script>
"use strict";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v) => Math.max(0, Math.min(100, v ?? 0));
function clock(t) {
  const d = new Date(t * 1000), now = new Date();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? hm : `${d.toLocaleDateString([], { weekday: "short" })} ${hm}`;
}
const shortName = (n) => n.replace(/[-_]\d{8}[-_]\d{6}$/, "");
function cardHtml(g) {
  const l = g.ledger || { holders: [], queue: [], flags: [] };
  const who = l.holders.map((c) => `<b>${esc(c.owner)}</b>${c.frozen ? " paused" : c.est_end ? " " + clock(c.est_end) : ""}`).join(", ");
  const wait = l.queue.length ? ` +${l.queue.length} waiting` : "";
  const flag = (l.flags || []).map((f) => `<span class="flag">${esc(f.kind.replace("-", " "))}</span>`).join(" ");
  const tip = [g.card_name, g.name, ...(l.flags || []).map((f) => f.detail)].filter(Boolean).join(" · ");
  return `<div class="card" title="${esc(tip)}"><span class="lab">g${g.index}</span>${gpuDials(g, true)}<span class="who">${who || "free"}${wait}${flag ? " · " + flag : ""}</span></div>`;
}
function runHtml(r) {
  const when = r.finish_at ? clock(r.finish_at) : "";
  const card = r.card != null ? `g${r.card}` : "";
  const name = r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(shortName(r.name))}</a>` : esc(shortName(r.name));
  return `<div class="crun" title="${esc(r.name)}"><span class="lab">${card}</span><span class="rname"><bdi>${name}</bdi></span><div class="bar"><i style="width:${clamp(r.pct)}%"></i></div><span class="val">${r.pct == null ? "?" : Math.round(r.pct) + "%"} ${when}</span></div>`;
}
function hostHtml(h, now) {
  let note = "", cls = "", tip = "";
  if (!h.online) { note = h.last_error ? "not answering" : "offline"; cls = "bad"; }
  else {
    const stale = (h.runs || []).filter((r) => r.state === "stale" && now - (r.last_log_at ?? 0) < 6 * 3600);
    if (stale.length) { note = stale.length > 1 ? `${stale.length} stale runs` : "stale run"; cls = "warn"; tip = stale.map((r) => r.name).join(", "); }
  }
  const down = Object.entries(h.service_health || {}).filter(([n, c]) => !c.ok && !(h.optional || []).includes(n));
  if (!note && down.length) {
    note = down.length > 1 ? `${down.length} services down` : `${down[0][0]} down`;
    cls = "bad"; tip = down.map(([n, c]) => `${n}: ${c.detail}`).join("; ");
  }
  if (!note && (h.unplaced_procs || []).length) { note = "unpinned GPU use"; cls = "warn"; }
  if (!note && h.roaming) note = `roaming · ${h.roaming}`;
  const running = (h.runs || []).filter((r) => r.state === "running");
  return `<div class="host">
    <div class="hname"><span class="dot ${h.online ? "on" : ""}"></span>${esc(h.name)}<span class="note ${cls}" title="${esc(tip)}">${esc(note)}</span></div>
    ${(h.gpus || []).map(cardHtml).join("")}
    ${running.map(runHtml).join("")}
  </div>`;
}
function yachtsHtml(s) {
  const cs = s.charters || [];
  const live = cs.filter((c) => ["launching", "live", "landing"].includes(c.state));
  const waiting = cs.filter((c) => c.state === "requested");
  const adrift = cs.filter((c) => c.state === "adrift");
  const parts = [];
  if (adrift.length) parts.push(`<span class="bad">${adrift.length} adrift: destroy failed</span>`);
  if (waiting.length) parts.push(`<a class="warn" href="/" target="_blank">${waiting.length} waiting for a purser</a>`);
  if (live.length) {
    const cost = live.reduce((t, c) => t + (c.cost_so_far || 0), 0);
    const rate = live.reduce((t, c) => t + (c.rate_usd_h || 0), 0);
    parts.push(`${live.length} yacht${live.length > 1 ? "s" : ""} out, $${rate.toFixed(2)}/h, $${cost.toFixed(2)} so far`);
  }
  return parts.join(" · ");
}
async function refresh() {
  try {
    const s = await (await fetch("/api/state", { cache: "no-store" })).json();
    document.getElementById("yachts").innerHTML = yachtsHtml(s);
    document.getElementById("hosts").innerHTML = s.hosts.map((h) => hostHtml(h, s.time)).join("") ||
      `<div class="empty">No hosts registered.</div>`;
    const live = s.hosts.filter((h) => h.online).length;
    document.getElementById("meta").textContent = `${live}/${s.hosts.length} live · ${new Date(s.time * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    document.getElementById("meta").textContent = "service unreachable";
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
